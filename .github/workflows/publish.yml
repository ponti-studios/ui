name: release-ui

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to publish from (default: main)'
        required: false
        type: string
        default: 'main'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs['packages/ui--release_created'] }}
      tag_name: ${{ steps.release.outputs['packages/ui--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-ui:
    needs: release-ui
    if: ${{ needs.release-ui.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-ui.outputs.tag_name }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.1"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ needs.release-ui.outputs.tag_name }}
        run: |
          VERSION="$(node -p 'require("./packages/ui/package.json").version')"
          test "$RELEASE_TAG" = "ui-v$VERSION"
          git fetch --tags origin
          test -n "$(git rev-parse --verify "refs/tags/$RELEASE_TAG")"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"

      - name: Publish UI package
        working-directory: packages/ui
        run: npm publish --provenance --access public

      - name: Verify published package
        run: |
          VERSION="$(node -p 'require("./packages/ui/package.json").version')"
          for attempt in $(seq 1 10); do
            RESOLVED="$(npm view "@ponti-studios/ui@$VERSION" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [ "$RESOLVED" = "$VERSION" ]; then
              echo "Resolved @ponti-studios/ui@$VERSION on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt: @ponti-studios/ui@$VERSION not yet resolvable, retrying in 10s..."
            sleep 10
          done
          echo "::error::@ponti-studios/ui@$VERSION did not become resolvable after 10 attempts"
          exit 1

  publish-ui-manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.1"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish UI package
        working-directory: packages/ui
        run: npm publish --provenance --access public

      - name: Verify published package
        run: |
          VERSION="$(node -p 'require("./packages/ui/package.json").version')"
          for attempt in $(seq 1 10); do
            RESOLVED="$(npm view "@ponti-studios/ui@$VERSION" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [ "$RESOLVED" = "$VERSION" ]; then
              echo "Resolved @ponti-studios/ui@$VERSION on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt: @ponti-studios/ui@$VERSION not yet resolvable, retrying in 10s..."
            sleep 10
          done
          echo "::error::@ponti-studios/ui@$VERSION did not become resolvable after 10 attempts"
          exit 1
